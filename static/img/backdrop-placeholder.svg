<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="title desc">
  <title id="title">Backdrop placeholder</title>
  <desc id="desc">Fallback placeholder when a movie backdrop is unavailable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
  </defs>
  <rect width="480" height="270" rx="18" fill="url(#bg)" />
  <rect x="24" y="24" width="432" height="222" rx="14" fill="none" stroke="#94a3b8" stroke-dasharray="8 8" stroke-width="4" />
  <g fill="none" stroke="#64748b" stroke-linecap="round" stroke-linejoin="round" stroke-width="8">
    <rect x="166" y="74" width="148" height="92" rx="10" />
    <path d="M190 152l36-34 26 24 30-32 32 34" />
    <circle cx="208" cy="102" r="10" fill="#64748b" stroke="none" />
  </g>
  <text x="240" y="208" fill="#475569" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    BACKDROP
  </text>
  <text x="240" y="230" fill="#64748b" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    unavailable
  </text>
</svg>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- Холодный кеш изображений отдаёт 302 на CDN TMDB: заранее открываем
		     DNS/TCP/TLS к этому origin, чтобы первая картинка не платила за них. -->
		<link rel="preconnect" href="https://image.tmdb.org" />
		<link rel="dns-prefetch" href="https://image.tmdb.org" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Forum&family=Merriweather:wght@900&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

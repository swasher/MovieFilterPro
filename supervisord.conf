[supervisord]
nodaemon=true
logfile=/dev/fd/1
logfile_maxbytes=0
loglevel=info
user=root

[program:web]
command=daphne -b 0.0.0.0 -p 8009 --http-timeout 600 movie_filter_pro.asgi:application
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5

[program:worker]
command=python -m huey.bin.huey_consumer movie_filter_pro.huey.HUEY --worker-type thread --workers 2 -q
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autorestart=true
startsecs=3
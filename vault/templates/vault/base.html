{% extends "base.html" %}

{% block css %}
    <style>
        .vault-layout {
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr);
            gap: 0;
            min-height: 100vh;
        }
        .vault-sidebar {
            position: sticky;
            top: 0.75rem;
            align-self: start;
            width: 280px;
            max-height: calc(100vh - 1.5rem);
            overflow-y: auto;
            z-index: 1020;
        }
        .vault-content {
            min-width: 0;
        }
        .vault-movie-grid {
            --vault-movie-card-width: 160px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--vault-movie-card-width), var(--vault-movie-card-width)));
            gap: 1.5rem;
            justify-content: start;
        }
        .vault-movie-grid-item {
            width: var(--vault-movie-card-width);
        }
        .vault-grid-full {
            grid-column: 1 / -1;
        }
        .vault-poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
        }
        .vault-poster-placeholder {
            width: 100%;
            aspect-ratio: 2 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .movie-card {
            transition: transform 0.2s;
        }
        .movie-card:hover {
            transform: translateY(-5px);
        }
        .vault-sync-btn {
            opacity: 0.92;
        }
        .movie-card:hover .vault-sync-btn {
            opacity: 1;
        }
        @media (max-width: 991px) {
            .vault-layout {
                display: block;
            }
            .vault-sidebar {
                position: static;
                width: auto;
                max-height: none;
            }
            .vault-content {
                min-width: auto;
            }
        }
    </style>
    {% block vault_css %}{% endblock %}
{% endblock %}

{% block body %}
    <div class="vault-layout">
        {% include "vault/_sidebar.html" %}
        <main class="vault-content">
            <div class="container-fluid py-4 px-4">
                <div id="tmdb-sync-result-global" class="mb-3"></div>
                {% block vault_content %}{% endblock %}
            </div>
        </main>
    </div>
{% endblock %}
